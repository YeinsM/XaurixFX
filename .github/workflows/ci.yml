name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xaurix_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: xaurix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xaurix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://xaurix_test:ci_ephemeral_only@localhost:5432/xaurix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
